name: Unit Test

on:
  pull_request:
    branches: ['main', 'feature']

env:
  DJANGO_SETTINGS_MODULE: config.settings
  DATABASE_URL: postgresql://postgres:password@localhost:5432/gh_action
  REDIS_URL: redis://127.0.0.1:6379
  ALLOWED_HOSTS: "*"
  DEBUG: True
  CSRF_TRUSTED_ORIGINS: ""


jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.12]

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: gh_action
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install factory-boy
        pip install -r requirements.txt

    - name: Wait for PostgreSQL
      run: |
        until PGPASSWORD=password psql -h localhost -U postgres -d gh_action -c "SELECT 1" > /dev/null 2>&1; do
          echo "Waiting for PostgreSQL..."
          sleep 2
        done

    - name: Setup Django Migrations
      run: |
        python manage.py migrate
    - name: Run Pytest
      run: |
        pytest --disable-warnings
